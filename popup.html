<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/font-awesome.css">
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/tailwind.css">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
    </head>
    <body class="full-width">
        <div class="container">
            <div class="row">
                <div class="col-md-12 p-0">
                    <div class="card">
                        <div class="header relative">
                            <div class="img">
                                <a href="https://www.futsnipingbot.com" target="_blank"></a>
                            </div>
                            <div class="header-img"></div>
                        </div>
                        <div class="bg-test"></div>
                        <div class="card-body px-4">
                            <form>
                                <div class="form-body my-2">
                                    <div class="row">
                                        <div class="col">
                                            <div class="form-group">
                                                <div class="input-div">
                                                    <div class="i icon">
                                                        <i class="fas fa-user"></i>
                                                    </div>
                                                    <div>
                                                        <h5>Email</h5>
                                                        <input type="email" class="input" id="email" required>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col">
                                            <div class="form-group">
                                                <div class="input-div">
                                                    <div class="i icon">
                                                        <i class="fas fa-lock"></i>
                                                    </div>
                                                    <div>
                                                        <h5>Password</h5>
                                                        <input type="password" class="input" id="password" required>
                                                        <div class="show">
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path d="M15 12c0 1.654-1.346 3-3 3s-3-1.346-3-3 1.346-3 3-3 3 1.346 3 3zm9-.449s-4.252 8.449-11.985 8.449c-7.18 0-12.015-8.449-12.015-8.449s4.446-7.551 12.015-7.551c7.694 0 11.985 7.551 11.985 7.551zm-7 .449c0-2.757-2.243-5-5-5s-5 2.243-5 5 2.243 5 5 5 5-2.243 5-5z"></path></svg>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col">
                                            <div class="form-group mb-0">
                                                <input checked type="checkbox" class="checkbox" id="remember-me">
                                                <a class="remember-me">Remember Me</a></div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col">
                                            <div class="form-group mb-0">
                                                <button id="login" type="submit" class="button">Login</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="login-footer pt-1 full-width relative">
                            <div class="footer-links pt-1 pb-2 px-3">
                                <div class="row text-right">
                                    <div class="col">
                                        <div class="form-group form-link mb-1">
                                            <small><a href="https://www.futsnipingbot.com/password/reset" target="_blank">Forgot password?</a></small>
                                        </div>
                                    </div>
                                </div>
                                <div class="row text-right">
                                    <div class="col">
                                        <div class="form-group form-link mb-1">
                                            <small><a href="https://www.futsnipingbot.com" target="_blank">Haven't got an account?</a></small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col form-body">
                                <p>Signed in as </p>
                                <p><strong id="username" class="block truncate"></strong><p>
                                <div class="form-group mb-0">
                                    <button id="logout" type="button" class="button logout-btn">Logout</button>
                                </div>
                            </div>
                        </div>
                        <div class="logout-footer pt-1 full-width relative">
                            <div class="footer-links pt-1 pb-2 px-3">
                                <div class="row text-right">
                                    <div class="col">
                                        <div class="form-group form-link mb-2">
                                            <small><a href="https://www.ea.com/ea-sports-fc/ultimate-team/web-app/" target="_blank">Go to FUT Web App</a></small></small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="js/jquery.min.js"></script> 
        <script src="js/popup.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
